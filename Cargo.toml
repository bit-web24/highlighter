[package]
name = "highlighter"
version = "0.1.0"
edition = "2024"

[dependencies]
chromiumoxide = "0.9.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
